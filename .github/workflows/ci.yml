name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # Performance gate: policy eval must stay well under 1ms p99 (SPEC §4.3).
      - run: go test -bench=. -benchmem ./internal/policy/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest # must be built with a Go >= the go.mod target version

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { GOOS: darwin, GOARCH: arm64 }
          - { GOOS: darwin, GOARCH: amd64 }
          - { GOOS: linux, GOARCH: arm64 }
          - { GOOS: linux, GOARCH: amd64 }
          - { GOOS: windows, GOARCH: arm64 }
          - { GOOS: windows, GOARCH: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.target.GOOS }}
          GOARCH: ${{ matrix.target.GOARCH }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./test/e2e/

  redteam:
    # The public attack battery. On macOS the kernel-sandbox attacks
    # (RT-06..RT-10) must pass; on Linux they report KNOWN GAP/SKIPPED
    # per the honest-degradation policy in SECURITY.md.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -v ./test/redteam/
        env:
          REDTEAM_REPORT: ${{ github.workspace }}/docs/redteam/RESULTS.md
      - name: Upload results matrix
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: redteam-results
          path: docs/redteam/RESULTS.md

