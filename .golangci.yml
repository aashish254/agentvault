version: "2"

linters:
  enable:
    - gosec
  exclusions:
    rules:
      # Test code intentionally spawns processes and writes exec stubs.
      - path: _test\.go
        linters: [gosec]
      - path: test/e2e
        linters: [gosec]
  settings:
    errcheck:
      # CLI output to cobra writers: failure mode is a broken pipe,
      # not a security issue. Everything else must check errors.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

formatters:
  enable:
    - goimports